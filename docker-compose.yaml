version: '3.8'

services:
  # 2. 💻 SERVICE BACK-END (Node.js của bạn)
  backend:
    build:
      context: ./backend 
      dockerfile: Dockerfile
    container_name: notetakingapp-backend
    ports:
      - "3000:3000" 
    restart: always
    environment:
      # LƯU Ý: Backend giờ sử dụng tài khoản ROOT để kết nối.
      DB_HOST: db 
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: MyStrongPassword123 
      DB_NAME: NoteTakingApp
      PORT: 3000
      FRONTEND_URL: http://localhost:5173 
    # Đợi cho đến khi dịch vụ 'db' báo cáo là 'healthy'
    depends_on:
      db:
        condition: service_healthy 
      
  # 3. 💾 SERVICE DATABASE (MySQL)
  db:
    # THAY ĐỔI IMAGE SANG PHIÊN BẢN ỔN ĐỊNH HƠN
    image: mysql:5.7
    container_name: notetakingapp 
    environment:
      # CHỈ CẦN CUNG CẤP MẬT KHẨU ROOT
      MYSQL_ROOT_PASSWORD: MyStrongPassword123 
      MYSQL_DATABASE: NoteTakingApp
      # BỎ HẾT MYSQL_USER và MYSQL_PASSWORD DÀNH CHO USER THƯỜNG
    ports:
      - "3307:3306" 
    volumes:
      - db_data:/var/lib/mysql
    # BỔ SUNG: Khai báo Healthcheck ĐƠN GIẢN NHẤT
    healthcheck:
      # Chỉ kiểm tra xem process đã chạy chưa, không dùng mật khẩu trong lệnh shell
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  db_data: